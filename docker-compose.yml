  # Development service (uncomment for development)
  nuxt-dev:
    build:
      context: .
      dockerfile: dev.dockerfile
    ports:
      - "3000:3000"
      - "24678:24678" # Nuxt DevTools
    environment:
      - NODE_ENV=development
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      - BASE_URL=http://localhost:8081
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    networks:
      - base
    command: npm run dev

networks:
  base:
    external: true

volumes:
  nuxt_data: